name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: test-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          grep -v '^-e \.$' requirements.txt > /tmp/requirements-ci.txt
          pip install --require-hashes -r /tmp/requirements-ci.txt

      - name: Run tests
        run: python -m pytest -q
