services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: policy-rag-backend:latest
    container_name: policy-rag-backend
    restart: unless-stopped
    env_file:
      - .env
    command: ["uvicorn", "policy_app.api:app", "--app-dir", "src", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
