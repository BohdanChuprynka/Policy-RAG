services:
  redis:
    image: redis:7-alpine
    container_name: policy-rag-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: policy-rag-backend:latest
    container_name: policy-rag-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    command: ["sh", "-c", "uvicorn policy_app.api:app --app-dir src --host 0.0.0.0 --port ${PORT:-8000}"]
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request; p=os.getenv('PORT','8000'); urllib.request.urlopen(f'http://localhost:{p}/health', timeout=5)\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    image: policy-rag-streamlit:latest
    container_name: policy-rag-streamlit
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_BASE_URL: http://backend:${PORT:-8000}
      STREAMLIT_SERVER_PORT: ${STREAMLIT_PORT:-8501}
    depends_on:
      - backend
    ports:
      - "${STREAMLIT_PORT:-8501}:${STREAMLIT_PORT:-8501}"

volumes:
  redis-data:
