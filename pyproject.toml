[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-rag-app"
version = "0.1.0"
description = "Hybrid RAG policy assistant"
authors = [{name = "Bohdan"}]
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "openai",
    "numpy",
    "python-dotenv",
    "python-multipart",
    "llama-index-core",
    "llama-index-readers-file",
    "redis>=5.0",
]

[project.optional-dependencies]
test = ["pytest", "httpx", "fakeredis"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
